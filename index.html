<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduVision</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >
</head>


<body>


<!-- =========================================
     LANDING PAGE
========================================= -->

<main id="home">

    <div class="hero">

        <div class="eyebrow">
            AI • SMART CLASSROOM
        </div>


        <h1>
            EduVision
        </h1>


        <p>
            Smarter classrooms through fast attendance,
            classroom monitoring and simple management.
        </p>


        <div class="tools">

            <button onclick="login('admin')">
                School Admin
            </button>


            <button onclick="login('teacher')">
                Teacher Login
            </button>


            <button onclick="login('register')">
                Register School
            </button>

        </div>


        <button onclick="login('evadmin')">
            EduVision Admin
        </button>


        <p class="muted">
            ● System Online
        </p>

    </div>

</main>



<!-- =========================================
     LOGIN
========================================= -->

<section
    id="login"
    class="hidden"
>

    <div class="card">

        <button onclick="goHome()">
            ← Back
        </button>


        <h2 id="lt">
            Login
        </h2>


        <div id="form"></div>


        <p id="msg"></p>

    </div>

</section>



<!-- =========================================
     APPLICATION
========================================= -->

<section
    id="app"
    class="hidden"
>

    <aside>

        <h2>
            EduVision
        </h2>


        <div id="who"></div>


        <nav id="nav"></nav>


        <button onclick="logout()">
            Log Out
        </button>

    </aside>


    <article>

        <small>
            AI • SMART CLASSROOM
        </small>


        <h1 id="title">
            Dashboard
        </h1>


        <div id="page"></div>

    </article>

</section>



<!-- =========================================
     SUPABASE
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<!-- =========================================
     FACE RECOGNITION
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js">
</script>



<!-- =========================================
     TENSORFLOW.JS
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js">
</script>



<!-- =========================================
     SMART OCCUPANCY OBJECT DETECTION
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js">
</script>



<!-- =========================================
     EDUVISION CONFIG
========================================= -->

<script src="/config.js"></script>



<!-- =========================================
     EDUVISION APPLICATION
========================================= -->

<script src="/app.js"></script>


</body>

</html>
