<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduVision</title>

    <link
        rel="stylesheet"
        href="/styles.css"
    >
</head>


<body>


<!-- =========================================
     LANDING PAGE
========================================= -->

<main id="home">

    <div class="hero zoom-panel">

        <div class="eyebrow">
            AI • SMART CLASSROOM
        </div>


        <h1>
            EduVision
        </h1>


        <p>
            Smarter classrooms through fast attendance,
            classroom monitoring and simple management.
        </p>


        <div class="cta-row">

            <button
                class="primary-action no-zoom"
                onclick="showSelection()"
            >
                Get Started
            </button>

        </div>


        <p class="muted">
            ● System Online
        </p>

    </div>

</main>



<!-- =========================================
     PORTAL SELECTION
========================================= -->

<section
    id="selection"
    class="hidden"
>

    <div class="selection-card zoom-panel">

        <div class="eyebrow">
            SELECT ACCESS
        </div>


        <h2>
            Choose Your Portal
        </h2>


        <p class="muted">
            Select how you want to access EduVision.
        </p>


        <div class="selection-list">


            <!-- SCHOOL ADMIN -->

            <button
                class="selection-button"
                onclick="login('admin')"
            >

                <span class="selection-label">
                    School Admin
                </span>

                <small>
                    Manage students, teachers and attendance
                </small>

            </button>



            <!-- TEACHER -->

            <button
                class="selection-button"
                onclick="login('teacher')"
            >

                <span class="selection-label">
                    Teacher Login
                </span>

                <small>
                    Attendance and classroom management
                </small>

            </button>



            <!-- REGISTER SCHOOL -->

            <button
                class="selection-button"
                onclick="login('register')"
            >

                <span class="selection-label">
                    Register School
                </span>

                <small>
                    Request access to EduVision
                </small>

            </button>



            <!-- EDUVISION ADMIN -->

            <button
                class="secondary-button no-zoom"
                onclick="login('evadmin')"
            >

                <span class="selection-label">
                    EduVision Admin
                </span>

                <small>
                    Review and manage registered schools
                </small>

            </button>


        </div>


        <button
            class="secondary-button no-zoom"
            onclick="goHome()"
        >
            ← Back to Home
        </button>


        <p class="muted">
            ● System Online
        </p>

    </div>

</section>



<!-- =========================================
     LOGIN / REGISTRATION
========================================= -->

<section
    id="login"
    class="hidden"
>

    <div class="card zoom-panel">


        <button
            class="no-zoom"
            onclick="showSelection()"
        >
            ← Back
        </button>


        <h2 id="lt">
            Login
        </h2>


        <div id="form"></div>


        <p id="msg"></p>


    </div>

</section>



<!-- =========================================
     EDUVISION APPLICATION
========================================= -->

<section
    id="app"
    class="hidden"
>


    <!-- SIDEBAR -->

    <aside>


        <h2>
            EduVision
        </h2>


        <div id="who"></div>


        <nav id="nav"></nav>


        <button
            class="no-zoom"
            onclick="logout()"
        >
            Log Out
        </button>


    </aside>



    <!-- MAIN DASHBOARD -->

    <article>


        <small>
            AI • SMART CLASSROOM
        </small>


        <h1 id="title">
            Dashboard
        </h1>


        <div id="page"></div>


    </article>


</section>



<!-- =========================================
     SUPABASE
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>



<!-- =========================================
     FACE RECOGNITION
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js">
</script>



<!-- =========================================
     TENSORFLOW.JS
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js">
</script>



<!-- =========================================
     SMART OCCUPANCY
========================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js">
</script>



<!-- =========================================
     YOUR EXISTING SUPABASE CONFIG
========================================= -->

<script src="/config.js"></script>



<!-- =========================================
     EDUVISION APP
========================================= -->

<script src="/app.js"></script>


</body>

</html>
